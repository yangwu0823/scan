<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="文件轉正">
<meta name="theme-color" content="#111315">
<title>文件拍照轉正</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet, exact pocket scanner for someone between client meetings
   IDEA: a light table: a dark graphite bed where the paper is the brightest thing in the room
   PICTURE: the photo itself, the found page lit up, four signal-orange pins and white edge bars
   COLOUR and TYPE: graphite surfaces, paper white, one signal orange; Noto Sans TC 800/500
   LAYOUT: app shell — slim top bar, full-bleed stage, tool strip and a thumb-reach action bar */
:root{color-scheme:dark;--bg:#111315;--stage:#08090a;--panel:#171a1d;--panel2:#22262a;--line:#2a2f34;--ink:#eef0f1;--mute:#9aa3aa;--acc:#ff5b2e;--accink:#1f0c05;--warn:#ffc24b;--hd:56px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:max(14px,env(safe-area-inset-left,0px));--sr:max(14px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,label{font:inherit;color:inherit}
:focus-visible{outline:3px solid #ffb199;outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.top{height:calc(var(--hd) + var(--st));padding:var(--st) var(--sr) 0 var(--sl);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin-right:auto;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.nav button{border:0;background:transparent;min-height:38px;padding:0 12px;border-radius:9px;font-weight:700;font-size:15px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav button[aria-current=true]{background:var(--panel2);color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:default}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--acc);color:var(--accink);font-size:13px;font-weight:800;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.z{background:var(--panel2);color:var(--mute)}
.view{height:calc(100vh - var(--hd) - var(--st));height:calc(100dvh - var(--hd) - var(--st));display:flex;flex-direction:column}
.view[hidden]{display:none}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(110% 85% at 50% 42%,#1d2125 0%,var(--stage) 72%)}
#cv{display:block;touch-action:none;cursor:crosshair}
#loupe{position:absolute;top:12px;width:124px;height:124px;border-radius:50%;border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;background:#000}
.pill{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:7px 14px;border-radius:99px;background:rgba(17,19,21,.86);border:1px solid var(--line);font-size:14px;color:#d8dcdf;text-align:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#cmp{transition:opacity .5s}#cmp.gone{opacity:0}
.tools{display:flex;justify-content:center;gap:4px;padding:6px var(--sr) 6px var(--sl);border-top:1px solid var(--line)}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:78px;min-height:58px;padding:6px 10px;border:0;background:transparent;border-radius:12px;font-size:13px;color:#d8dcdf;cursor:pointer}
.tool:hover{background:var(--panel)}
.bar{display:flex;gap:10px;align-items:center;padding:10px var(--sr) calc(10px + var(--sb)) var(--sl);background:var(--panel);border-top:1px solid var(--line)}
.btn{min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
.btn:hover{border-color:#3a4148}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:800}
.btn.pri:hover{filter:brightness(1.06)}
.btn.grow{flex:1}
.btn:disabled{opacity:.4;cursor:default}
.rv{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
#pv{display:block;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.55);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.panel{background:var(--panel);border-top:1px solid var(--line);padding:10px var(--sr) 6px var(--sl);max-height:44vh;overflow:auto}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:8px}
.seg button{border:0;background:transparent;min-height:36px;padding:0 16px;border-radius:8px;font-weight:700;font-size:14px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--ink)}
.fl{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.fb{flex:none;width:74px;border:0;background:transparent;padding:0;cursor:pointer;color:var(--mute);font-size:13px;text-align:center;scroll-snap-align:start}
.fb img{display:block;width:74px;height:96px;object-fit:cover;border-radius:10px;border:2px solid transparent;background:#2a2f34;margin-bottom:4px}
.fb[aria-pressed=true]{color:var(--ink);font-weight:700}
.fb[aria-pressed=true] img{border-color:var(--acc)}
.adj{display:grid;gap:12px;padding:2px 0 8px}
.ar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ar>span{width:3.2em;font-size:14px;color:var(--mute);flex:none}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#111315;border-color:var(--ink);font-weight:700}
.ib{width:44px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:#d8dcdf}
.ib:disabled{opacity:.3;cursor:default}
.sl{display:flex;align-items:center;gap:10px;flex:1}
.sl output{width:2.6em;text-align:right;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:32px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.link{border:0;background:transparent;color:var(--mute);font-size:14px;text-decoration:underline;cursor:pointer;padding:8px 4px;min-height:40px}
.dbody{flex:1;min-height:0;overflow:auto;padding:14px var(--sr) 20px var(--sl)}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0 auto 16px;max-width:1100px}
.fld{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.fld.g{flex:1 1 220px}
.fld input,.fld select{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 12px;font-size:16px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:1100px;margin:0 auto}
.pg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;gap:6px}
.th{position:relative;aspect-ratio:3/4;background:var(--stage);border-radius:10px;display:grid;place-items:center;overflow:hidden;border:0;cursor:pointer;padding:10px}
.th img{max-width:100%;max-height:100%;display:block;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.no{position:absolute;left:8px;top:8px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:rgba(17,19,21,.85);font-size:13px;font-weight:800;display:grid;place-items:center}
.warn{position:absolute;right:8px;top:8px;padding:2px 8px;border-radius:99px;background:var(--warn);color:#2a1d00;font-size:12px;font-weight:800}
.pga{display:flex;justify-content:space-between}
.pga .ib{border:0;background:transparent;width:40px}
.pga .ib:hover:not(:disabled){background:var(--panel2)}
.add{border:1.5px dashed #3a4148;border-radius:16px;display:grid;align-content:center;gap:10px;padding:16px;min-height:220px}
.add .btn{width:100%}
.empty{display:grid;justify-items:center;text-align:center;gap:12px;padding:8vh 16px;max-width:420px;margin:0 auto}
.empty svg{width:132px;height:110px}
.empty h2{margin:0;font-size:22px}
.empty p{margin:0;color:var(--mute)}
.empty .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(86px + var(--sb));transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#f2f3f4;color:#16191b;padding:10px 16px;border-radius:14px;font-size:15px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:20;width:max-content;max-width:calc(100vw - 28px);transition:opacity .2s}
#toast button{border:0;background:transparent;color:#c63a12;font-weight:800;cursor:pointer;min-height:36px;padding:0 4px}
#busy{position:fixed;inset:0;background:rgba(5,6,7,.66);display:grid;place-items:center;z-index:30}
#busy>div{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;width:min(320px,calc(100vw - 40px));display:grid;gap:12px;text-align:center;font-weight:700}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
[hidden]{display:none!important}
@media(min-width:900px){.rv{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr)}.panel{max-height:none;border-top:0;border-left:1px solid var(--line);padding:16px 18px}.fl{flex-wrap:wrap;overflow:visible}.bar{justify-content:flex-end}.bar .btn.grow{flex:0 1 260px}}
@media(max-width:420px){.brand span{display:none}.tool{min-width:0;flex:1}.btn{padding:0 12px}}
@media(prefers-reduced-motion:reduce){#toast,.prog i{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M3.5 8h3.2l1.8-2.6h7l1.8 2.6h3.2v11h-17z"/><circle cx="12" cy="13.2" r="3.6"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="m4 17 5-5 4 4 2.5-2.5L20 18"/><circle cx="15.5" cy="9" r="1.6"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="m9 9.5 6-1.5 1 6.5-6.5 1z"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="i-rotl" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M4.6 10A8 8 0 1 1 6 16.5"/></symbol>
  <symbol id="i-rotr" viewBox="0 0 24 24"><path d="M20 4v6h-6"/><path d="M19.4 10A8 8 0 1 0 18 16.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M8 3.5h7l4 4v11.5a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 6.5 19V5A1.5 1.5 0 0 1 8 3.5z"/><path d="M14.5 3.5V8h4.5M9.5 12.5h6M9.5 16h6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M5 19h3.5L19 8.5 15.5 5 5 15.5z"/><path d="m13.5 7 3.5 3.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M8 3.5h7l4 4v11.5a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 6.5 19V5A1.5 1.5 0 0 1 8 3.5z"/><path d="M14.5 3.5V8h4.5M12 11v6m0 0-2.5-2.5M12 17l2.5-2.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
</svg>

<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#ff5b2e"/><path d="M7 11V8.5A1.5 1.5 0 0 1 8.5 7H11M21 7h2.5A1.5 1.5 0 0 1 25 8.5V11M25 21v2.5a1.5 1.5 0 0 1-1.5 1.5H21M11 25H8.5A1.5 1.5 0 0 1 7 23.5V21" fill="none" stroke="#1f0c05" stroke-width="1.8" stroke-linecap="round"/><rect x="11" y="10" width="10" height="12" rx="1" fill="#fbfaf6"/><path d="M13.2 13.5h5.6M13.2 16h5.6M13.2 18.5h3.4" stroke="#1f0c05" stroke-width="1.3" stroke-linecap="round"/></svg><span>文件轉正</span></div>
  <nav class="nav" aria-label="畫面">
    <button type="button" id="nav-edit" aria-current="true">編輯</button>
    <button type="button" id="nav-doc" aria-current="false">文件 <span class="badge z" id="nav-count">0</span></button>
  </nav>
</header>

<input class="vh" id="cam" type="file" accept="image/*" capture="environment">
<input class="vh" id="pick" type="file" accept="image/*" multiple>

<main>
  <section class="view" id="v-edit" aria-label="調整四個角">
    <div class="stage" id="ed-stage">
      <canvas id="cv" aria-label="照片與文件四角，可拖曳調整"></canvas>
      <canvas id="loupe" hidden></canvas>
      <p class="pill" id="hint" aria-live="polite"></p>
    </div>
    <div class="tools">
      <button class="tool" type="button" id="t-auto"><svg class="i"><use href="#i-auto"/></svg>自動偵測</button>
      <button class="tool" type="button" id="t-full"><svg class="i"><use href="#i-full"/></svg>整張照片</button>
      <label class="tool" for="cam"><svg class="i"><use href="#i-cam"/></svg>重拍</label>
      <label class="tool" for="pick"><svg class="i"><use href="#i-img"/></svg>選相片</label>
    </div>
    <div class="bar">
      <button class="btn" type="button" id="ed-cancel" hidden><svg class="i"><use href="#i-back"/></svg>取消</button>
      <button class="btn pri grow" type="button" id="go">轉正<svg class="i"><use href="#i-next"/></svg></button>
    </div>
  </section>

  <section class="view" id="v-result" aria-label="效果" hidden>
    <div class="rv">
      <div class="stage">
        <canvas id="pv" aria-label="轉正後的預覽，按住可比較原圖"></canvas>
        <p class="pill" id="cmp">按住預覽圖可比較原圖</p>
      </div>
      <div class="panel">
        <div class="seg" role="group" aria-label="設定"><button type="button" data-tab="filter" aria-pressed="true">濾鏡</button><button type="button" data-tab="adj" aria-pressed="false">調整</button></div>
        <div class="fl" id="filters"></div>
        <div class="adj" id="adj" hidden>
          <div class="ar"><span>比例</span>
            <button class="chip" type="button" data-r="auto" aria-pressed="true">自動</button>
            <button class="chip" type="button" data-r="a4" aria-pressed="false">A4 文件</button>
            <button class="chip" type="button" data-r="card" aria-pressed="false">證件／名片</button></div>
          <div class="ar"><span>方向</span>
            <button class="ib" type="button" id="rl" aria-label="向左轉"><svg class="i"><use href="#i-rotl"/></svg></button>
            <button class="ib" type="button" id="rr" aria-label="向右轉"><svg class="i"><use href="#i-rotr"/></svg></button></div>
          <div class="ar"><span>亮度</span><div class="sl"><input type="range" id="br" min="-50" max="50" value="0" aria-label="亮度"><output id="brv">0</output></div></div>
          <div class="ar"><span>對比</span><div class="sl"><input type="range" id="ct" min="-50" max="50" value="0" aria-label="對比"><output id="ctv">0</output></div></div>
          <div><button class="link" type="button" id="reset">亮度與對比重設</button></div>
        </div>
      </div>
    </div>
    <div class="bar">
      <button class="btn" type="button" id="back"><svg class="i"><use href="#i-back"/></svg>調整</button>
      <button class="btn" type="button" id="save1"><svg class="i"><use href="#i-save"/></svg>存圖片</button>
      <button class="btn pri grow" type="button" id="commit"><svg class="i"><use href="#i-check"/></svg><span id="commit-t">加入文件</span></button>
    </div>
  </section>

  <section class="view" id="v-doc" aria-label="文件" hidden>
    <div class="dbody">
      <div class="dhead" id="dhead">
        <label class="fld g">PDF 檔名<input id="fname" type="text" autocomplete="off" placeholder="掃描文件"></label>
        <label class="fld">頁面大小<select id="psize"><option value="a4">A4 紙張</option><option value="fit">照原圖比例</option></select></label>
        <button class="link" type="button" id="clear">全部清除</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">
        <svg viewBox="0 0 132 110" aria-hidden="true"><rect x="30" y="14" width="62" height="82" rx="4" fill="#22262a" transform="rotate(-8 61 55)"/><rect x="40" y="10" width="62" height="82" rx="4" fill="#fbfaf6"/><path d="M50 30h40M50 40h40M50 50h30M50 60h40M50 70h24" stroke="#9aa3aa" stroke-width="4" stroke-linecap="round"/><circle cx="104" cy="88" r="16" fill="#ff5b2e"/><path d="M104 81v14M97 88h14" stroke="#1f0c05" stroke-width="3.4" stroke-linecap="round"/></svg>
        <h2>還沒有頁面</h2>
        <p>拍下文件或一次選好幾張相片，每張會自動轉正，排好順序後就能合併成一份 PDF。</p>
        <div class="row"><label class="btn pri" for="cam"><svg class="i"><use href="#i-cam"/></svg>拍照</label><label class="btn" for="pick"><svg class="i"><use href="#i-img"/></svg>選相片</label></div>
      </div>
    </div>
    <div class="bar">
      <button class="btn" type="button" id="saveall"><svg class="i"><use href="#i-save"/></svg>存成圖片</button>
      <button class="btn pri grow" type="button" id="pdf"><svg class="i"><use href="#i-pdf"/></svg>匯出 PDF</button>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite" hidden><span id="toast-t"></span><button type="button" id="toast-b" hidden></button></div>
<div id="busy" hidden><div><span id="busy-t">處理中…</span><div class="prog"><i id="busy-p"></i></div></div></div>

<script>
/* ---------- document detection ---------- */
const DET={};
{

    const k=Math.min(1,MAXS/Math.max(im.naturalWidth,im.naturalHeight)),c=cnv(Math.round(im.naturalWidth*k),Math.round(im.naturalHeight*k));

  dropCur();cur=newCur(file,src,idx);cur.sample=sample;
  if(idx>=0){const p=pages[idx];Object.assign(cur,{autoF:false,rot:p.rot,filt:p.filt,ratio:p.ratio,br:p.br,ct:p.ct,found:!p.flagged});cur.quad=p.qn.map(([a,b])=>[a*src.width,b*src.height])}

  busy(false);$('#ed-cancel').hidden=idx<0;hint();show('edit')}
function hint(){
  const t=cur.found?'拖橘點調四角，拖白條移動整條邊':'沒找到邊緣，請把橘點拖到文件四角';
  $('#hint').textContent=(cur.sample?'範例照片 · ':'')+t}
async function takeFiles(list){
  const fs=[...list].filter(f=>!f.type||f.type.startsWith('image/'));if(!fs.length)return;
  if(fs.length===1)return openFile(fs[0]);
  let bad=0,fl=0,n=0;
  for(let i=0;i<fs.length;i++){
    busy(true,`自動轉正第 ${i+1}／${fs.length} 張…`,i/fs.length);await tick();let src;
    try{src=await decode(fs[i])}catch(e){bad++;continue}
    dropCur();cur=newCur(fs[i],src,-1);autoDetect(true);
    try{await buildWarp(false);pickFilter();pages.push(await pageFromCur());n++;if(!cur.found){pages[pages.length-1].flagged=true;fl++}}catch(e){bad++}
    dropCur()}
  busy(false);renderDoc();show('doc');
  toast(`已加入 ${n} 頁`+(fl?`，其中 ${fl} 頁沒抓到邊，請點開檢查`:'')+(bad?`，${bad} 張讀不到`:''))}

/* ---------- editor ---------- */

function path(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<4;i++)c.lineTo(p[i][0],p[i][1]);c.closePath()}

    ctx.save();ctx.translate((a[0]+b[0])/2,(a[1]+b[1])/2);ctx.rotate(an);ctx.beginPath();

  p.forEach(([x,y],i)=>{ctx.beginPath();ctx.arc(x,y,drag===i?17:13,0,7);ctx.fillStyle='rgba(255,91,46,.28)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=ACC;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,3.4,0,7);ctx.fillStyle='#fff';ctx.fill()});
  cv.dataset.quad=JSON.stringify(cur.quad.map(q=>q.map(Math.round)))}
const focusPt=()=>{if(drag<4)return cur.quad[drag];const a=cur.quad[drag-4],b=cur.quad[(drag-3)%4];return[(a[0]+b[0])/2,(a[1]+b[1])/2]};
function loupe(){
  const lp=$('#loupe'),lc=lp.getContext('2d'),S=124,r=devicePixelRatio||1,cv=$('#cv');if(lp.width!==Math.round(S*r)){lp.width=lp.height=Math.round(S*r)}
  lp.hidden=false;const fp=focusPt(),[cx,cy]=fp,cb=cv.getBoundingClientRect(),sb=$('#ed-stage').getBoundingClientRect(),vx=toV(fp)[0]+cb.left-sb.left,z=Math.max(2.5,3*view.s),rs=S/z,src=cur.src;
  const left=vx>sb.width/2;lp.style.left=left?'12px':'auto';lp.style.right=left?'auto':'12px';

  const sx=Math.max(0,cx-rs/2),sy=Math.max(0,cy-rs/2),ex=Math.min(src.width,cx+rs/2),ey=Math.min(src.height,cy+rs/2);
  if(ex>sx&&ey>sy)lc.drawImage(src,sx,sy,ex-sx,ey-sy,(sx-cx)*z+S/2,(sy-cy)*z+S/2,(ex-sx)*z,(ey-sy)*z);
  path(lc,cur.quad.map(p=>[(p[0]-cx)*z+S/2,(p[1]-cy)*z+S/2]));lc.lineWidth=1.5;lc.strokeStyle=ACC;lc.stroke();
  lc.strokeStyle='#fff';lc.lineWidth=1;lc.beginPath();lc.moveTo(S/2,S/2-12);lc.lineTo(S/2,S/2+12);lc.moveTo(S/2-12,S/2);lc.lineTo(S/2+12,S/2);lc.stroke()}
{
  const cv=$('#cv'),ptr=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};

    vq.forEach(([a,b],i)=>{const d=Math.hypot(a-x,b-y);if(d<bd){bd=d;bi=i}});
    if(bi<0){let ed=38;for(let k=0;k<4;k++){const a=vq[k],b=vq[(k+1)%4],d=Math.hypot((a[0]+b[0])/2-x,(a[1]+b[1])/2-y);if(d<ed){ed=d;bi=4+k}}}
    if(bi<0)return;drag=bi;grab=[x,y];start=cur.quad.map(q=>q.slice());

/* ---------- warp & filters ---------- */
function outSize(){
  const[a,b,c,d]=cur.quad,L=(p,r)=>Math.hypot(p[0]-r[0],p[1]-r[1]);

  const R={a4:Math.SQRT2,card:85.6/54}[cur.ratio];if(R){if(w>=h)h=w/R;else w=h*R}
  const k=Math.min(1,MAXO/Math.max(w,h));return[Math.max(16,Math.round(w*k)),Math.max(16,Math.round(h*k))]}
function warp(sc,q,W,H){

  const m=DET.homog([[0,0],[W,0],[W,H],[0,H]],q),out=new ImageData(W,H),od=out.data,mx=sw-1.001,my=sh-1.001;
  for(let v=0;v<H;v++){const vy=v+.5;
    for(let u=0;u<W;u++){const ux=u+.5,z=m[6]*ux+m[7]*vy+1;
      let x=(m[0]*ux+m[1]*vy+m[2])/z-.5,y=(m[3]*ux+m[4]*vy+m[5])/z-.5;
      x=x<0?0:x>mx?mx:x;y=y<0?0:y>my?my:y;
      const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,i=(y0*sw+x0)*4,j=i+sw*4,o=(v*W+u)*4;
      for(let c=0;c<3;c++){const a=sd[i+c]+(sd[i+4+c]-sd[i+c])*fx,bb=sd[j+c]+(sd[j+4+c]-sd[j+c])*fx;od[o+c]=a+(bb-a)*fy}

async function buildWarp(preview){

function pickFilter(){
  if(!cur.autoF)return;cur.autoF=false;const t=scaled(cur.warped,64),d=t.getContext('2d',{willReadFrequently:true}).getImageData(0,0,t.width,t.height).data;let s=0,n=0;

function rotated(base,rot){const w=base.width,h=base.height,sw=rot%2?h:w,sh=rot%2?w:h,c=cnv(sw,sh),x=c.getContext('2d');x.translate(sw/2,sh/2);x.rotate(rot*Math.PI/2);x.drawImage(base,-w/2,-h/2);return c}

      const yy=Math.min(sh-1,Math.max(0,y+dy)),xx=Math.min(sw-1,Math.max(0,x+dx)),v=t[(yy*sw+xx)*4+k];if(v>m)m=v}d[o+k]=m}}

/* ---------- result ---------- */

/* ---------- document ---------- */

  $('#empty').hidden=!!n;$('#grid').hidden=!n;$('#dhead').hidden=!n;$('#pdf').disabled=$('#saveall').disabled=!n;

  $('#grid').innerHTML=pages.map((p,i)=>`<div class="pg"><button class="th" type="button" data-edit="${i}" aria-label="編輯第 ${i+1} 頁"><img src="${p.thumb}" alt=""><span class="no">${i+1}</span>${p.flagged?'<span class="warn">請檢查</span>':''}</button>
    <div class="pga"><button class="ib" type="button" data-mv="${i}" data-d="-1" aria-label="第 ${i+1} 頁往前移"${i?'':' disabled'}>${I('left')}</button><button class="ib" type="button" data-edit="${i}" aria-label="編輯第 ${i+1} 頁">${I('edit')}</button><button class="ib" type="button" data-del="${i}" aria-label="刪除第 ${i+1} 頁">${I('trash')}</button><button class="ib" type="button" data-mv="${i}" data-d="1" aria-label="第 ${i+1} 頁往後移"${i<n-1?'':' disabled'}>${I('right')}</button></div></div>`).join('')
    +`<div class="add"><label class="btn pri" for="cam">${I('cam')}拍照</label><label class="btn" for="pick">${I('img')}選相片</label></div>`;
  clearArm=false;$('#clear').textContent='全部清除'}
const fname=()=>($('#fname').value.trim().replace(/[\\/:*?"<>|]+/g,'_').replace(/\.pdf$/i,''))||('掃描文件_'+today());

    obj(id,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(PW)} ${f(PH)}] /Resources << /XObject << /Im0 ${id+2} 0 R >> >> /Contents ${id+1} 0 R >>`);
    obj(id+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    obj(id+2,`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,jpg,'\nendstream')}
  const total=3+3*N,xref=pos;let t=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(t+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'})}

/* ---------- saving ---------- */
function anchor(b,n){const a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6000)}
async function share(files){
  if(!touch||!navigator.canShare)return false;
  try{if(!navigator.canShare({files}))return false;await navigator.share({files});return true}
  catch(e){return!!e&&e.name==='AbortError'}}
async function save(blob,name){
  if(dl){try{await dl.save({filename:name,data:blob});toast('已儲存 '+name)}catch(e){toast(e&&e.code==='declined'?'已取消儲存':'沒有存成功，請再試一次')}return}
  if(await share([new File([blob],name,{type:name.endsWith('.pdf')?'application/pdf':'image/jpeg'})]))return;
  anchor(blob,name);toast('已下載 '+name)}
async function saveMany(list){
  if(list.length===1)return save(list[0][0],list[0][1]);
  if(dl){for(const[b,n]of list){try{await dl.save({filename:n,data:b})}catch(e){if(e&&e.code==='declined')break}}return}
  if(await share(list.map(([b,n])=>new File([b],n,{type:'image/jpeg'}))))return;
  for(const[b,n]of list){anchor(b,n);await new Promise(r=>setTimeout(r,350))}
  toast(`已下載 ${list.length} 張圖片`)}

/* ---------- sample ---------- */
function makeSample(){
  const W=1400,H=1050,c=cnv(W,H),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#86603f');g.addColorStop(1,'#553823');x.fillStyle=g;x.fillRect(0,0,W,H);
  let s=11;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<280;i++){x.fillStyle=rnd()<.5?`rgba(40,22,10,${.05+rnd()*.08})`:`rgba(210,160,110,${.03+rnd()*.06})`;x.fillRect(0,rnd()*H,W,1+rnd()*5)}
  const D=cnv(840,1188),d=D.getContext('2d'),F='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  d.fillStyle='#fdfdfb';d.fillRect(0,0,840,1188);d.fillStyle='#1d2329';d.font=`700 50px ${F}`;d.fillText('保險要保書',70,125);
  d.font=`24px ${F}`;d.fillStyle='#5b6670';d.fillText('範例文件，僅供示範',70,170);d.fillStyle='#1d2329';d.fillRect(70,198,700,4);
  ['要保人','被保險人','出生日期','聯絡電話','通訊地址'].forEach((t,i)=>{const y=245+i*72;d.strokeStyle='#9aa4ad';d.lineWidth=2;d.strokeRect(70,y,700,58);
    d.fillStyle='#38424a';d.font=`24px ${F}`;d.fillText(t,92,y+38);d.fillStyle='#2b4f8a';d.fillRect(250,y+27,160+rnd()*260,7)});
  for(let i=0;i<9;i++){d.fillStyle='#98a1a9';d.fillRect(70,650+i*40,i===8?380:690-rnd()*70,11)}
  d.fillStyle='#1d2329';d.fillRect(460,1075,310,2);d.font=`22px ${F}`;d.fillText('要保人簽名',460,1112);
  const q=[[480,92],[1030,146],[1082,968],[382,986]];
  x.save();x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=42;x.shadowOffsetX=16;x.shadowOffsetY=24;x.fillStyle='#000';path(x,q);x.fill();x.restore();
  const m=DET.homog(q,[[0,0],[840,0],[840,1188],[0,1188]]),id=x.getImageData(0,0,W,H),o=id.data,dd=d.getImageData(0,0,840,1188).data;
  for(let py=85;py<995;py++)for(let px=375;px<1090;px++){const z=m[6]*px+m[7]*py+1,u=(m[0]*px+m[1]*py+m[2])/z,v=(m[3]*px+m[4]*py+m[5])/z;
    if(u<0||v<0||u>=840||v>=1188)continue;const si=((v|0)*840+(u|0))*4,oi=(py*W+px)*4,L=.83+.15*(px/W)-.07*(py/H);
    o[oi]=dd[si]*L;o[oi+1]=dd[si+1]*L;o[oi+2]=dd[si+2]*L*.97}
  x.putImageData(id,0,0);free(D);return c}

/* ---------- events ---------- */
for(const inp of[$('#cam'),$('#pick')])inp.addEventListener('change',()=>{const l=[...inp.files];inp.value='';takeFiles(l)});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)takeFiles(e.dataTransfer.files)});
$('#nav-edit').onclick=()=>{if(cur)show(cur.stage==='result'&&cur.pbase?'result':'edit')};
$('#nav-doc').onclick=()=>show('doc');
$('#t-auto').onclick=()=>{if(!cur)return;autoDetect(false);hint();draw();toast(cur.found?'已重新偵測':'沒找到文件邊緣，請手動拖曳四個角')};
$('#t-full').onclick=()=>{if(!cur)return;const W=cur.src.width,H=cur.src.height;cur.quad=[[0,0],[W,0],[W,H],[0,H]];draw()};
$('#ed-cancel').onclick=()=>{dropCur();show('doc')};
$('#go').onclick=()=>{if(cur)toResult()};
$('#back').onclick=()=>show('edit');
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;
  for(const x of document.querySelectorAll('[data-tab]'))x.setAttribute('aria-pressed',x===b);
  $('#filters').hidden=b.dataset.tab!=='filter';$('#adj').hidden=b.dataset.tab!=='adj'};
$('#filters').onclick=e=>{const b=e.target.closest('[data-f]');if(!b||!cur)return;cur.filt=b.dataset.f;cur.autoF=false;sync();drawPreview(false)};
document.querySelector('#adj').addEventListener('click',async e=>{const b=e.target.closest('[data-r]');if(!b||!cur||b.dataset.r===cur.ratio)return;
  cur.ratio=b.dataset.r;sync();busy(true,'重新計算…');await tick();try{await buildWarp(true);drawPreview(false);thumbs()}finally{busy(false)}});
$('#rl').onclick=()=>{cur.rot=(cur.rot+3)%4;cur.bg=null;drawPreview(false);thumbs()};
$('#rr').onclick=()=>{cur.rot=(cur.rot+1)%4;cur.bg=null;drawPreview(false);thumbs()};
for(const k of['br','ct'])$('#'+k).addEventListener('input',e=>{cur[k]=+e.target.value;$('#'+k+'v').textContent=cur[k];queuePreview()});
$('#reset').onclick=()=>{cur.br=cur.ct=0;sync();drawPreview(false)};
{const pv=$('#pv'),on=()=>{if(cur)drawPreview(true)},off=()=>{if(cur)drawPreview(false)};
  pv.addEventListener('pointerdown',on);pv.addEventListener('pointerup',off);pv.addEventListener('pointerleave',off);pv.addEventListener('pointercancel',off);
  pv.addEventListener('contextmenu',e=>e.preventDefault())}
$('#save1').onclick=async()=>{if(!cur)return;busy(true,'產生圖片…');await tick();let b=null;
  try{const c=finish(cur.warped,cur,false);b=await blobOf(c,.92);free(c)}finally{busy(false)}
  if(b)save(b,`${fname()}${cur.idx>=0?'_'+(cur.idx+1):''}.jpg`)};
$('#commit').onclick=async()=>{if(!cur)return;busy(true,'儲存中…');await tick();
  try{const pg=await pageFromCur();
    if(cur.idx>=0){URL.revokeObjectURL(pages[cur.idx].thumb);pages[cur.idx]=pg;toast(`已更新第 ${cur.idx+1} 頁`)}
    else{pages.push(pg);toast(`已加入第 ${pages.length} 頁`)}
    dropCur();renderDoc();show('doc')}
  catch(e){toast('儲存失敗，請再試一次。')}
  finally{busy(false)}};
$('#grid').onclick=e=>{
  const ed=e.target.closest('[data-edit]'),mv=e.target.closest('[data-mv]'),dl_=e.target.closest('[data-del]');
  if(ed)return openFile(pages[+ed.dataset.edit].file,+ed.dataset.edit);
  if(mv){const i=+mv.dataset.mv,j=i+(+mv.dataset.d);if(j<0||j>=pages.length)return;[pages[i],pages[j]]=[pages[j],pages[i]];renderDoc();return}
  if(dl_){const i=+dl_.dataset.del,p=pages.splice(i,1)[0];renderDoc();toast(`已刪除第 ${i+1} 頁`,{label:'復原',fn:()=>{pages.splice(Math.min(i,pages.length),0,p);renderDoc()}})}};
$('#clear').onclick=()=>{if(!clearArm){clearArm=true;$('#clear').textContent='再按一次確認清除';return}
  pages.forEach(p=>URL.revokeObjectURL(p.thumb));pages=[];renderDoc()};
$('#saveall').onclick=()=>{if(pages.length)saveMany(pages.map((p,i)=>[p.out,`${fname()}_${i+1}.jpg`]))};
$('#pdf').onclick=async()=>{if(!pages.length)return;busy(true,'產生 PDF…');await tick();let b=null;
  try{b=await buildPdf($('#psize').value)}catch(e){toast('PDF 產生失敗，請再試一次。')}finally{busy(false)}
  if(b)save(b,fname()+'.pdf')};

/* ---------- start ---------- */
$('#fname').placeholder='掃描文件_'+today();
renderDoc();
{const s=makeSample();s.toBlob(b=>{free(s);openFile(b,-1,true)},'image/jpeg',.92)}
try{const ic=cnv(180,180),x=ic.getContext('2d');x.fillStyle='#ff5b2e';x.fillRect(0,0,180,180);x.fillStyle='#fbfaf6';x.fillRect(58,44,64,88);x.fillStyle='#1f0c05';
  for(let i=0;i<4;i++)x.fillRect(70,64+i*16,i===3?24:40,6);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=ic.toDataURL('image/png');document.head.appendChild(l)}catch(e){}
(async()=>{try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){dl=null}})();
}
</script>
